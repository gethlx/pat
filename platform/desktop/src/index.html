<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>PAT</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
      }
      h1,
      h2 {
        font-size: 1.25rem;
        margin: 0 0 1rem;
      }
      h2 {
        font-size: 1.1rem;
        margin-top: 1.5rem;
      }
      label {
        display: grid;
        gap: 0.25rem;
        margin-bottom: 0.75rem;
      }
      input,
      textarea,
      select {
        padding: 0.35rem 0.5rem;
      }
      textarea {
        min-height: 6em;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem 1.25rem;
        border-bottom: 1px solid #ddd;
      }
      main,
      #view-settings {
        padding: 1.25rem;
      }
      .executor {
        display: grid;
        gap: 0.5rem;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-bottom: 1rem;
        padding: 0.75rem;
        border: 1px solid #ddd;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="view-settings" data-view="settings" hidden>
      <h1>设置</h1>
      <form id="settings-form">
        <label>账本路径 <input id="ledgerPath" name="ledgerPath" /></label>
        <label>pat-ledger 路径 <input id="patLedgerPath" name="patLedgerPath" /></label>
        <label>工作目录 <input id="workDir" name="workDir" /></label>
        <label>git 路径 <input id="gitPath" name="gitPath" /></label>
        <label>Git 用户名 <input id="gitUserName" name="gitUserName" /></label>
        <label>Git 邮箱 <input id="gitUserEmail" name="gitUserEmail" /></label>
        <h2>执行器</h2>
        <div id="executors"></div>
        <div class="actions">
          <button type="button" id="add-executor">添加执行器</button>
          <button type="submit" id="save-settings">保存</button>
          <button type="button" id="back-to-workbench" hidden>返回工作台</button>
        </div>
      </form>
    </div>
    <div id="view-workbench" data-view="workbench" hidden>
      <header class="toolbar">
        <button type="button" id="new-task">新建任务</button>
        <button type="button" id="open-settings">设置</button>
      </header>
      <main>
        <section id="task-form-section" aria-label="任务表单">
          <h1>工作台</h1>
          <form id="task-form">
            <label>Agent
              <select id="agent-select" name="agent">
                <option value="">请选择 Agent</option>
              </select>
            </label>
            <label>任务
              <textarea id="task-text" name="goal" rows="6"></textarea>
            </label>
            <label>预期结果文件名
              <input id="artifact-name" name="artifact" placeholder="result.md" />
            </label>
            <button type="button" id="dispatch-task">派活</button>
          </form>
        </section>
        <section id="current-task" aria-label="当前任务">
          <h2>当前任务</h2>
          <p id="current-task-empty">还没有任务。选一个 Agent，写下任务后点派活。</p>
        </section>
        <section id="recent-tasks" aria-label="最近任务">
          <h2>最近任务</h2>
          <p id="recent-tasks-empty">还没有任务。选一个 Agent，写下任务后点派活。</p>
        </section>
      </main>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
