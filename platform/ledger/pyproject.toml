[project]
name = "pat-ledger"
version = "0.1.0"
description = "PAT ledger engine CLI"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }

[project.scripts]
pat-ledger = "pat_ledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
